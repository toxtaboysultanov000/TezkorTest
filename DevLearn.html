<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><title>DevLearn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14182b;--mut:#6b7190;--line:#e3e6f0;--acc:#3b5bff;--xp:#f5a524;--ok:#12a36b;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1020;--card:#161a30;--ink:#e8ebff;--mut:#8b91b5;--line:#252a4a;--acc:#6f86ff}}
:root[data-theme=dark]{--bg:#0d1020;--card:#161a30;--ink:#e8ebff;--mut:#8b91b5;--line:#252a4a;--acc:#6f86ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .3s,color .3s;display:flex;min-height:100vh}
aside{width:230px;padding:20px 14px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;flex:none;transition:transform .25s}
.logo{font-weight:700;font-size:22px;padding:0 10px 18px}.logo b{color:var(--acc)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--mut);font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
nav button:hover{background:var(--bg);color:var(--ink)}nav button.on{background:var(--acc);color:#fff}
main{flex:1;padding:24px;max-width:960px;min-width:0}
h1{margin:0 0 4px;font-size:26px}h2{font-size:17px;margin:0 0 12px}.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid .card{margin:0}.big{font-size:28px;font-weight:700}.lbl{color:var(--mut);font-size:13px}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .8s}
.bar.xp i{background:var(--xp)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:10px 0 6px;font-size:14px}
button.p{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer}
button.s{background:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.nav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.nav .cur{outline:2px solid var(--acc)}.nav .ans{background:var(--acc);color:#fff}.nav .mk{border-color:var(--xp);border-width:2px}
.timer{font-family:ui-monospace,monospace;font-size:22px;font-weight:700}.timer.low{color:var(--bad);animation:p 1s infinite}
@keyframes p{50%{opacity:.4}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}.tag{padding:2px 9px;border-radius:20px;font-size:12px;background:var(--bg)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;transform:translateY(120px);transition:transform .4s;z-index:9}
#toast.show{transform:none}
.top{display:none;position:sticky;top:0;background:var(--card);padding:10px 14px;border-bottom:1px solid var(--line);z-index:5}
@media(max-width:760px){body{display:block}aside{position:fixed;z-index:6;transform:translateX(-100%)}aside.open{transform:none}.top{display:flex;justify-content:space-between}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside id="side"><div class="logo">Dev<b>Learn</b></div><nav id="nav"></nav>
<button class="s" style="margin:14px 8px" onclick="theme()">Mavzuni almashtirish</button></aside>
<div style="flex:1;min-width:0"><div class="top"><button class="s" onclick="side.classList.toggle('open')">Menyu</button><b>DevLearn</b></div><main id="v"></main></div>
<div id="toast"></div>
<script>
const LV=[0,500,1200,2000,3500],SL=['Beginner','Elementary','Intermediate','Advanced','Expert'];
let S={xp:1250,streak:7,skills:{HTML:78,CSS:64,JavaScript:45,Python:31}};
try{const j=JSON.parse(localStorage.getItem('dl'));if(j)S=j}catch(e){}
const save=()=>{try{localStorage.setItem('dl',JSON.stringify(S))}catch(e){}};
const lvl=x=>LV.filter(l=>x>=l).length;
const sk=p=>SL[Math.min(4,Math.floor(p/20))];
const Q=[
{t:'Variables',q:"JavaScriptda o'zgaruvchi e'lon qilish uchun qaysi keyword ishlatiladi?",o:['print','let','echo','write'],a:1},
{t:'Variables',q:"const bilan e'lon qilingan qiymat qayta tayinlanishi mumkin.",o:['Rost','Yolg\'on'],a:1},
{t:'Functions',q:"Funksiyadan qiymat qaytarish uchun qaysi kalit so'z ishlatiladi?",o:['back','return','give','out'],a:1},
{t:'Arrays',q:"Massivning oxiriga element qo'shadigan metod qaysi?",o:['push','pop','shift','add'],a:0},
{t:'Arrays',q:"[1,2,3].length nimaga teng?",o:['2','3','4','undefined'],a:1}];
const LB=[['Ali',12450],['Vali',11820],['Hasan',10940],['Siz',0]];
const pages={dash,courses,skills,test,board,teacher};
const names={dash:'Dashboard',courses:'Kurslarim',skills:'Skillar',test:'Testlar',board:'Leaderboard',teacher:'Teacher: Test yaratish'};
const nav=document.getElementById('nav'),v=document.getElementById('v');
for(const k in names){const b=document.createElement('button');b.textContent=names[k];b.dataset.k=k;b.onclick=()=>go(k);nav.append(b)}
function go(k){[...nav.children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));side.classList.remove('open');pages[k]();scrollTo(0,0)}
function theme(){const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',3000)}
function xpbar(){const l=lvl(S.xp),a=LV[l-1],b=LV[l]||a+1500;return `<div class="row"><span>Level ${l}</span><span>${S.xp} / ${b} XP</span></div><div class="bar xp"><i style="width:${Math.min(100,(S.xp-a)/(b-a)*100)}%"></i></div>`}
function dash(){v.innerHTML=`<h1>Welcome back, Student!</h1><p class="sub">Bugun nimani o'rganamiz?</p>
<div class="grid"><div class="card"><div class="big">${S.xp}</div><div class="lbl">Total XP</div></div><div class="card"><div class="big">${lvl(S.xp)}</div><div class="lbl">Level</div></div><div class="card"><div class="big">${S.streak}</div><div class="lbl">Kunlik streak</div></div><div class="card"><div class="big">3</div><div class="lbl">Tugatilgan testlar</div></div></div>
<div class="card"><h2>Level progress</h2>${xpbar()}</div>
<div class="card"><h2>Haftalik o'qish (daqiqa)</h2><svg viewBox="0 0 280 90" style="width:100%;max-width:480px">${[30,55,20,70,45,80,60].map((h,i)=>`<rect x="${i*40+6}" y="${85-h}" width="26" height="${h}" rx="5" fill="var(--acc)"/>`).join('')}</svg></div>
<button class="p" onclick="go('test')">Testni boshlash</button>`}
function courses(){const c=[['HTML','Frontend','10 dars',78],['CSS','Frontend','10 modul',64],['JavaScript','Frontend','14 modul',45],['Python','Programming','12 modul',31]];
v.innerHTML=`<h1>Kurslarim</h1><p class="sub">Davom ettirish uchun kursni tanlang.</p><input placeholder="Search courses..." oninput="[...document.querySelectorAll('.cc')].forEach(e=>e.style.display=e.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')">`+c.map(x=>`<div class="card cc"><div class="row"><b>${x[0]}</b><span class="tag">${x[1]}</span></div><div class="lbl">${x[2]}</div><div class="bar" style="margin-top:8px"><i style="width:${x[3]}%"></i></div></div>`).join('')}
function skills(){v.innerHTML=`<h1>Skill profili</h1><p class="sub">Test, kurs va mashqlar skill XP beradi.</p>`+Object.entries(S.skills).map(([k,p])=>`<div class="card"><div class="row"><b>${k} Skill</b><span>${p}% · ${sk(p)}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`).join('')}
function board(){const r=LB.map(x=>x[0]=='Siz'?['Siz',S.xp]:x).sort((a,b)=>b[1]-a[1]);
v.innerHTML=`<h1>Leaderboard</h1><p class="sub">All time</p><div class="card scroll"><table><tr><th>#</th><th>Student</th><th>XP</th></tr>${r.map((x,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${x[0]}</td><td>${x[1].toLocaleString()}</td></tr>`).join('')}</table></div>`}
let T=null;
function test(){if(T&&!T.done)return run();T=null;v.innerHTML=`<h1>JavaScript — 1-mavzu nazorat testi</h1><p class="sub">Teacher: Aziz Karimov</p><div class="card"><div class="row"><span>Savollar</span><b>${Q.length}</b></div><div class="row"><span>Vaqt</span><b>2:00</b></div><div class="row"><span>O'tish bali</span><b>70%</b></div></div><button class="p" onclick="start()">Start Test</button>`}
function start(){T={i:0,a:Array(Q.length).fill(null),m:{},t:120,done:false,t0:Date.now()};T.h=setInterval(()=>{T.t--;const e=document.getElementById('tm');if(e){e.textContent=fmt(T.t);e.className='timer'+(T.t<20?' low':'')}if(T.t<=0)finish()},1000);run()}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function run(){const q=Q[T.i];v.innerHTML=`<div class="row"><h2>Savol ${T.i+1} / ${Q.length}</h2><span class="timer" id="tm">${fmt(T.t)}</span></div>
<div class="nav">${Q.map((_,i)=>`<button class="${i==T.i?'cur ':''}${T.a[i]!=null?'ans ':''}${T.m[i]?'mk':''}" onclick="T.i=${i};run()">${i+1}</button>`).join('')}</div>
<div class="card"><p style="font-size:18px;margin-top:0">${q.q}</p>${q.o.map((o,j)=>`<button class="opt ${T.a[T.i]==j?'sel':''}" onclick="T.a[T.i]=${j};run()">${'ABCD'[j]}) ${o}</button>`).join('')}</div>
<div class="row"><span><button class="s" ${T.i?'':'disabled'} onclick="T.i--;run()">Previous</button> <button class="s" ${T.i<Q.length-1?'':'disabled'} onclick="T.i++;run()">Next</button></span><button class="s" onclick="T.m[T.i]=!T.m[T.i];run()">${T.m[T.i]?'Belgini olib tashlash':'Mark for review'}</button></div>
<button class="p" style="margin-top:14px" onclick="confirm('Testni topshirasizmi?')&&finish()">Submit Test</button>`}
function finish(){clearInterval(T.h);T.done=true;const by={};let ok=0;Q.forEach((q,i)=>{const c=T.a[i]==q.a;ok+=c;(by[q.t]=by[q.t]||[0,0]);by[q.t][1]++;by[q.t][0]+=c});
const pct=Math.round(ok/Q.length*100),pass=pct>=70,gain=pass?50+(pct==100?100:0):10,sg=Math.round(pct/12);
S.xp+=gain;const old=S.skills.JavaScript;S.skills.JavaScript=Math.min(100,old+sg);save();
const weak=Object.entries(by).filter(([k,x])=>x[0]/x[1]<.7).map(x=>x[0]);
v.innerHTML=`<h1>${pass?'🎉 PASSED':'Not passed'}</h1><p class="sub">${ok} / ${Q.length} to'g'ri · ${pct}% · ${fmt(Math.round((Date.now()-T.t0)/1000))}</p>
<div class="card"><h2>Mavzular bo'yicha</h2>${Object.entries(by).map(([k,x])=>{const p=Math.round(x[0]/x[1]*100);return `<div class="row"><span>${k}</span><b class="${p>=70?'ok':'bad'}">${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>`}).join('')}${weak.length?`<p>${weak.join(', ')} mavzusini yana takrorlash tavsiya qilinadi.</p>`:''}</div>
<div class="card"><b>+${gain} XP</b> · JavaScript Skill: ${old}% → ${S.skills.JavaScript}%${xpbar()}</div><button class="p" onclick="T=null;test()">Try Again</button>`;toast('+'+gain+' XP olindi')}
let TQ=[];
function teacher(){v.innerHTML=`<h1>Create Test</h1><p class="sub">Savol qo'shing, so'ng nashr qiling.</p><div class="card"><label>Test nomi<input id="tn" placeholder="JavaScript — 1-mavzu nazorat testi"></label>
<label>Savol<input id="tq"></label><label>Variantlar (vergul bilan)<input id="to" placeholder="print, let, echo, write"></label><label>To'g'ri javob raqami (1 dan)<input id="ta" type="number" min="1" value="2"></label>
<button class="s" onclick="addQ()">Add Question</button></div><div id="tl"></div><button class="s" onclick="toast('Draft saqlandi')">Save Draft</button> <button class="p" onclick="TQ.length?toast('Test nashr qilindi'):toast('Avval kamida bitta savol qo\\'shing')">Publish Test</button>`;list()}
function addQ(){const q=tq.value.trim(),o=to.value.split(',').map(s=>s.trim()).filter(Boolean),a=+ta.value;if(!q||o.length<2||a<1||a>o.length){toast("Savol va kamida 2 variant kerak; javob raqami variantlar ichida bo'lsin");return}TQ.push({q,o,a});tq.value=to.value='';list()}
function list(){tl.innerHTML=TQ.map((x,i)=>`<div class="card"><b>${i+1}. ${x.q}</b><div class="lbl">${x.o.map((o,j)=>(j+1==x.a?'✓ ':'')+o).join(' · ')}</div></div>`).join('')||'<div class="card lbl">Hali savol yo\'q. Birinchi savolni yuqorida qo\'shing.</div>'}
go('dash');
</script></body></html>
