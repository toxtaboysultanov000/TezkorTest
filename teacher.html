<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>O'qituvchi - EduTest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header class="top">
        <div style="display:flex;gap:10px;align-items:center"><button class="burger"
                onclick="toggleMenu()">☰</button><span class="brand">EduTest</span></div>
        <div class="right"><span class="hello" id="hello">O'qituvchi</span><button class="btn small ghost"
                onclick="logout()">Logout</button></div>
    </header>
    <div class="layout">
        <nav class="side"><button data-v="dash" onclick="show('dash')">🏠 Dashboard</button><button data-v="tests"
                onclick="show('tests')">📝 Testlar</button><button data-v="create" onclick="show('create')">➕ Test
                yaratish</button><button data-v="subjects" onclick="show('subjects')">📚 Fanlar</button><button
                data-v="students" onclick="show('students')">👨‍🎓 O'quvchilar</button><button data-v="results"
                onclick="show('results')">📊 Natijalar</button><button data-v="settings" onclick="show('settings')">⚙️
                Sozlamalar</button></nav>
        <main class="main" id="main"></main>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/results.js"></script>
    <script src="js/teacher.js"></script>
</body>

</html>
