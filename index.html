<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tezkor Test</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="login">
        <h1 style="color:var(--blue)">Tezkor Test</h1>
        <p class="muted">Bilimingizni sinab ko'ring!</p>
        <div id="choice" class="choices"><button class="choice" onclick="showForm('student')">👨‍🎓<br>O'quvchi
                kirishi</button><button class="choice" onclick="showForm('teacher')">👨‍🏫<br>O'qituvchi
                kirishi</button></div>
        <form id="studentForm" class="card" hidden onsubmit="loginStudent(event)">
            <h3>O'quvchi kirishi</h3>
            <label>Ism<input id="sFirst" placeholder="Ali"></label><label>Familiya<input id="sLast"
                    placeholder="Valiyev"></label><label>Parol<input id="sPass" type="password"
                    placeholder="12345"></label>
            <button class="btn" type="submit">Kirish</button>
            <div id="sMsg" class="msg"></div><button type="button" class="link" onclick="back()">← Orqaga</button>
        </form>
        <form id="teacherForm" class="card" hidden onsubmit="loginTeacher(event)">
            <h3>O'qituvchi sifatida kirish</h3>
            <label>Login<input id="tUser" placeholder="teacher"></label><label>Parol<input id="tPass" type="password"
                    placeholder="123456"></label>
            <button class="btn" type="submit">Kirish</button>
            <div id="tMsg" class="msg"></div><button type="button" class="link" onclick="back()">← Orqaga</button>
        </form>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
